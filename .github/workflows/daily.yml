name: Daily shortlist

on:
  schedule:
    - cron: "0 5 * * *"      # 05:00 UTC = 07:00 Paris (summer), 06:00 (winter)
  workflow_dispatch: {}      # "Run workflow" button for an on-demand refresh

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # past seasons of football-data.co.uk never change, so keep them between runs
      - uses: actions/cache@v4
        with:
          path: data/football_data
          key: football-data-${{ github.run_id }}
          restore-keys: football-data-

      - name: Analyse and build site
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python build_site.py

      - name: Publish
        run: |
          git config user.name "sportsstats-bot"
          git config user.email "sportsstats-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Shortlist $(date -u +%F)"
          git push
